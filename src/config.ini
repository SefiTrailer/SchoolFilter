; ==============================================================================
; SchoolFilter Configuration File
; ==============================================================================
; If CloudPacUrl is specified, student computers will dynamically fetch the whitelist
; from this cloud URL (e.g. GitHub Gist / GitHub Raw / Web Server / Google Drive).
; This allows the teacher to update the whitelist ONCE in the cloud without
; reconfiguring individual lab computers.
;
; If CloudPacUrl is left empty or commented out, student computers will use the
; local protected PAC file: file://C:/Program Files/SchoolFilter/filter.pac
;
; Example:
; CloudPacUrl=https://raw.githubusercontent.com/YourSchool/filter/main/filter.pac
; ==============================================================================
CloudPacUrl=
